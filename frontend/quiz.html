<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto px-4">
        <header class="text-center py-6">
            <h1 class="text-4xl font-bold">Quiz</h1>
        </header>
        <main>
            <section class="quiz-section flex flex-col items-center justify-center bg-gray-100 rounded-md p-6">
                <div class="quiz-container w-full max-w-md">
                    <div class="question-container mb-4">
                        <h2 class="text-2xl font-bold">Question 1</h2>
                        <p class="text-lg">What is the capital of France?</p>
                    </div>
                    <div class="options-container space-y-2">
                        <button class="option-button w-full py-2 px-4 bg-blue-500 text-white rounded-md">Paris</button>
                        <button class="option-button w-full py-2 px-4 bg-blue-500 text-white rounded-md">London</button>
                        <button class="option-button w-full py-2 px-4 bg-blue-500 text-white rounded-md">Berlin</button>
                        <button class="option-button w-full py-2 px-4 bg-blue-500 text-white rounded-md">Madrid</button>
                    </div>
                    <div class="submit-container mt-6">
                        <button class="submit-button w-full py-2 px-4 bg-green-500 text-white rounded-md">Submit</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
