<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - Notes Buddy</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto px-4">
        <header class="text-center py-6">
            <h1 class="text-4xl font-bold">ChatBot</h1>
            <p class="text-lg">Ask me anything about Notes Buddy!</p>
        </header>
        <main>
            <section class="chatbot-section flex flex-col items-center justify-center bg-gray-100 rounded-md p-6">
                <div class="chat-window w-full max-w-lg bg-white rounded-lg shadow-md p-4">
                    <div class="messages h-64 overflow-y-auto mb-4">
                        <!-- Messages will be dynamically added here -->
                    </div>
                    <div class="input-group flex items-center">
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="user-input" type="text" placeholder="Type your message...">
                        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline ml-2" id="send-button">
                            Send
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="scripts.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const messagesContainer = document.querySelector(".messages");
            const userInput = document.getElementById("user-input");
            const sendButton = document.getElementById("send-button");

            sendButton.addEventListener("click", function () {
                const userMessage = userInput.value.trim();
                if (userMessage) {
                    addMessage("You", userMessage);
                    userInput.value = "";
                    // Simulate bot response
                    setTimeout(function () {
                        addMessage("Bot", "This is a simulated response.");
                    }, 1000);
                }
            });

            function addMessage(sender, message) {
                const messageElement = document.createElement("div");
                messageElement.classList.add("message", "mb-2");
                messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
