<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto px-4">
        <header class="text-center py-6">
            <h1 class="text-4xl font-bold">Quiz Result</h1>
        </header>
        <main>
            <section class="result-section flex flex-col items-center justify-center bg-gray-100 rounded-md p-6">
                <div class="result-container w-full max-w-md">
                    <div class="result-details mb-4">
                        <h2 class="text-2xl font-bold">Your Results</h2>
                        <p class="text-lg">Correct: <span class="text-green-500">8</span></p>
                        <p class="text-lg">Wrong: <span class="text-red-500">2</span></p>
                        <p class="text-lg">Total Questions: 10</p>
                        <p class="text-lg">You got: <span class="text-yellow-500">80%</span></p>
                    </div>
                    <div class="actions-container mt-6">
                        <button class="retry-button w-full py-2 px-4 bg-blue-500 text-white rounded-md">Retry</button>
                        <button class="home-button w-full py-2 px-4 bg-green-500 text-white rounded-md mt-2">Go to Home</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
