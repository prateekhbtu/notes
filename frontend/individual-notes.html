<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Notes</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto px-4">
        <header class="text-center py-6">
            <h1 class="text-4xl font-bold">Individual Notes</h1>
        </header>
        <main>
            <section class="notes-section py-6">
                <div class="note-card bg-white p-4 rounded-md shadow-md mb-4">
                    <h2 class="text-2xl font-bold mb-2">Note Title</h2>
                    <p class="text-gray-700">This is the content of the note. It can be multiple paragraphs long and include various types of information.</p>
                </div>
                <div class="note-card bg-white p-4 rounded-md shadow-md mb-4">
                    <h2 class="text-2xl font-bold mb-2">Another Note Title</h2>
                    <p class="text-gray-700">This is another note. It also contains important information and can be styled using Tailwind CSS.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
